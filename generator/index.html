<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Generator</h1>
    <form id="form">
        <label>Imię</label>
        <input type="text" id="name" placeholder="Wpisz tutaj" required>
        
        <label>Nazwisko</label>
        <input type="text" id="surname" placeholder="Wpisz tutaj" required>
        
        <label>Data urodzenia</label>
        <input type="text" id="birthday" placeholder="Wpisz tutaj" required>
        
        <label>Płeć</label>
        <select id="sex" required>
            <option value="m">Mężczyzna</option>
            <option value="k">Kobieta</option>
        </select>
        
        <label>Zdjęcie</label>
        <input type="text" id="image" placeholder="https://imgur.com/..." required>
        
        <label>Miejsce urodzenia</label>
        <input type="text" id="birthPlace" placeholder="Wpisz tutaj" required>
        
        <label>Kraj urodzenia</label>
        <input type="text" id="countryOfBirth" placeholder="Wpisz tutaj" required>
        
        <label>Obywatelstwo</label>
        <input type="text" id="nationality" placeholder="Wpisz tutaj" required>
        
        <label>Adres zamieszkania</label>
        <input type="text" id="adress1" placeholder="Wpisz tutaj" required>
        
        <label>Kod pocztowy</label>
        <input type="text" id="adress2" placeholder="Wpisz tutaj" required>
        
        <label>Miasto</label>
        <input type="text" id="city" placeholder="Wpisz tutaj" required>
        
        <label>Nazwisko rodowe</label>
        <input type="text" id="familyName" placeholder="Wpisz tutaj" required>
        
        <label>Imię ojca</label>
        <input type="text" id="fathersName" placeholder="Wpisz tutaj" required>
        
        <label>Nazwisko rodowe ojca</label>
        <input type="text" id="fathersFamilyName" placeholder="Wpisz tutaj" required>
        
        <label>Imię matki</label>
        <input type="text" id="mothersName" placeholder="Wpisz tutaj" required>
        
        <label>Nazwisko rodowe matki</label>
        <input type="text" id="mothersFamilyName" placeholder="Wpisz tutaj" required>
        
        <input type="submit" value="Wygeneruj">
    </form>

    <!-- Podłączenie pliku JavaScript -->
    <script src="script.js"></script>
</body>
</html>
